services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # Run a simple SQL login to verify SQL Server is accepting connections, not just running
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD}\" -Q \"SELECT 1\" -No -C"]
      interval: 10s      # check every 10 seconds
      timeout: 5s        # fail if no response within 5 seconds
      retries: 5         # mark unhealthy after 5 consecutive failures
      start_period: 15s  # grace period before first check (SQL Server needs time to initialise)

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=BookCatalogDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy  # API only starts once SQL Server passes its healthcheck

volumes:
  sqlserver_data:
