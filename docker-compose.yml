services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Your_Secure_Password_123!}"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=BookCatalogDb;User Id=sa;Password=${DB_PASSWORD:-Your_Secure_Password_123!};TrustServerCertificate=True;
    depends_on:
      - db

volumes:
  sqlserver_data:
