name: Deploy Workspace API to Azure

on:
  push:
    branches: [ "main" ] 

permissions:
  id-token: write 
  packages: write 
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Build and Test
      run: |
        dotnet build
        dotnet test

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set lower case image repository
      run: |
        echo "IMAGE_TAG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/workspace-task-api" >> $GITHUB_ENV

    - name: Install EF Core CLI
      run: dotnet tool install --global dotnet-ef

    # Runs EF migrations from CI runner if accessible.
    # continue-on-error is set to true because BookCatalog.API also executes
    # context.Database.MigrateAsync() on startup inside Container Apps using Managed Identity.
    - name: Apply Database Migrations
      continue-on-error: true
      env:
        DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
      run: |
        CLEAN_CONN="${DB_CONNECTION_STRING//\"/}"
        dotnet ef database update \
          --project BookCatalog.Infrastructure \
          --startup-project BookCatalog.API \
          --connection "$CLEAN_CONN"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE_TAG }}:${{ github.sha }}
          ${{ env.IMAGE_TAG }}:latest

    - name: Deploy to Azure Container Apps
      uses: azure/container-apps-deploy-action@v2
      with:
        registryUrl: ghcr.io
        registryUsername: ${{ github.actor }}
        registryPassword: ${{ secrets.GITHUB_TOKEN }}
        containerAppName: ca-bookcatalog-api-dev-002
        resourceGroup: rg-workspace-api-dev
        imageToDeploy: ${{ env.IMAGE_TAG }}:${{ github.sha }}
        containerAppEnvironment: cae-workspace-standard
        targetPort: 8080